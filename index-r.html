<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-auto-scroll@0.5.3/dist/js/splide-extension-auto-scroll.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
    // 1. Splide 설정 (기존 코드 유지)
    if (document.querySelector('#work-list')) {
        new Splide('#work-list', {
            type       : 'loop',
            drag       : 'free',
            focus      : 'center',
            autoWidth  : true,
            gap        : '10px',
            arrows     : false,
            pagination : false,
            autoScroll : { speed: 1, pauseOnHover: true, pauseOnFocus: false },
        }).mount(window.splide.Extensions);
    }

    // 2. 탭 및 인디케이터 제어
    const tabList = document.querySelector('.tab-container'); 
    const tabs = document.querySelectorAll('.tab-btn');
    const indicator = document.querySelector('.nav-indicator');
    const contents = document.querySelectorAll('.tab-content');

    function moveIndicator(element) {
        if (!indicator || !element) return;
        indicator.style.left = `${element.offsetLeft}px`;
        indicator.style.width = `${element.offsetWidth}px`;
    }

    // 첫 진입 시 active 위치 잡기
    const activeTab = document.querySelector('.tab-btn.active');
    if (activeTab) {
        // 브라우저가 Pretendard 폰트와 flex 레이아웃을 완전히 그릴 시간을 0.15초(150ms) 줍니다.
        setTimeout(() => {
            moveIndicator(activeTab);
        }, 150);
    }

    // 호버 및 클릭 이벤트
    tabs.forEach((tab, index) => {
        tab.addEventListener('mouseenter', () => moveIndicator(tab));

        tab.addEventListener('click', (e) => {
            e.preventDefault(); // a 태그 클릭 시 새로고침/위로튀기 방지
            
            tabs.forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');

            moveIndicator(tab);

            // 콘텐츠 전환
            if (contents.length > 0) {
                contents.forEach(content => {
                    content.classList.remove('active');
                    content.setAttribute('hidden', 'true');
                });
                if (contents[index]) {
                    contents[index].classList.add('active');
                    contents[index].removeAttribute('hidden');
                }
            }
        });
    });

    // 마우스가 메뉴 전체를 벗어나면 원래 선택된 탭으로 복귀
    if (tabList) {
        tabList.addEventListener('mouseleave', () => {
            const currentActive = document.querySelector('.tab-btn.active');
            if (currentActive) moveIndicator(currentActive);
        });
    }
});
</script>
</body>
